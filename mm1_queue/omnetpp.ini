[General]
network = queue_sim
sim-time-limit = 600s
warmup-period = 100s
repeat = 5

# Simulation configurations
**.vector-recording = true
**.scalar-recording = true

# Enable debug output
debug-on-errors = true

# Default Configuration: β_producer = 1s, β_service = 1s (utilization = 1.0)
[Config Default]
description = "Default M/M/1 queue: β_producer = 1s, β_service = 1s"

*.producer.meanInterArrivalTime = 1s
*.serviceUnit.meanServiceTime = 1s

# Warmup period for all modules
*.producer.warmupPeriod = 100s
*.queue.warmupPeriod = 100s
*.serviceUnit.warmupPeriod = 100s
*.sink.warmupPeriod = 100s

# Parameter Study: β_producer from 1s to 10s in 0.1s steps, β_service fixed at 1s
[Config ParameterStudy]
description = "Parameter study: β_producer = 1s to 10s (0.1s steps), β_service = 1s, 5 repetitions"

# Fixed service time at 1s
*.serviceUnit.meanServiceTime = 1s

# Warmup period for all modules
*.producer.warmupPeriod = 100s
*.queue.warmupPeriod = 100s
*.serviceUnit.warmupPeriod = 100s
*.sink.warmupPeriod = 100s

# Parameter sweep for producer inter-arrival time (β_producer from 1s to 10s in 0.1s steps)
*.producer.meanInterArrivalTime = ${betaProducer=1.0s, 1.1s, 1.2s, 1.3s, 1.4s, 1.5s, 1.6s, 1.7s, 1.8s, 1.9s, 2.0s, 2.1s, 2.2s, 2.3s, 2.4s, 2.5s, 2.6s, 2.7s, 2.8s, 2.9s, 3.0s, 3.1s, 3.2s, 3.3s, 3.4s, 3.5s, 3.6s, 3.7s, 3.8s, 3.9s, 4.0s, 4.1s, 4.2s, 4.3s, 4.4s, 4.5s, 4.6s, 4.7s, 4.8s, 4.9s, 5.0s, 5.1s, 5.2s, 5.3s, 5.4s, 5.5s, 5.6s, 5.7s, 5.8s, 5.9s, 6.0s, 6.1s, 6.2s, 6.3s, 6.4s, 6.5s, 6.6s, 6.7s, 6.8s, 6.9s, 7.0s, 7.1s, 7.2s, 7.3s, 7.4s, 7.5s, 7.6s, 7.7s, 7.8s, 7.9s, 8.0s, 8.1s, 8.2s, 8.3s, 8.4s, 8.5s, 8.6s, 8.7s, 8.8s, 8.9s, 9.0s, 9.1s, 9.2s, 9.3s, 9.4s, 9.5s, 9.6s, 9.7s, 9.8s, 9.9s, 10.0s}

# Calculate rates for reference (for documentation only)
# λ = 1/β_producer, μ = 1/β_service = 1Hz, ρ = λ/μ = λ

# Default M/M/1 configuration for testing
[Config Default]
description = "M/M/1 Queue with λ=0.5, μ=1.0 (ρ=0.5)"
*.lambda = 0.5Hz  # Arrival rate (λ)
*.mu = 1.0Hz      # Service rate (μ)

# Warmup period for all modules
*.producer.warmupPeriod = 100s
*.queue.warmupPeriod = 100s
*.serviceUnit.warmupPeriod = 100s
*.sink.warmupPeriod = 100s

# Theoretical values for ρ=0.5:
# - Average number in system: L = ρ/(1-ρ) = 0.5/0.5 = 1.0
# - Average waiting time in system: W = L/λ = 1.0/0.5 = 2.0s
# - Average queue length: Lq = ρ²/(1-ρ) = 0.25/0.5 = 0.5
# - Average waiting time in queue: Wq = ρ/μ(1-ρ) = 0.5/1.0*0.5 = 1.0s

[Config Balanced]
extends = Default
description = "Balanced system: λ=0.8, μ=1.0 (ρ=0.8)"
*.lambda = 0.8Hz
*.mu = 1.0Hz

[Config LightLoad]
extends = Default
description = "Light load: λ=0.2, μ=1.0 (ρ=0.2)"
*.lambda = 0.2Hz
*.mu = 1.0Hz

[Config HeavyLoad]
extends = Default
description = "Heavy load: λ=0.9, μ=1.0 (ρ=0.9)"
*.lambda = 0.9Hz
*.mu = 1.0Hz

[Config FastService]
extends = Default
description = "Fast service: λ=0.5, μ=2.0 (ρ=0.25)"
*.lambda = 0.5Hz
*.mu = 2.0Hz

[Config SlowService]
extends = Default
description = "Slow service: λ=0.5, μ=0.6 (ρ=0.83)"
*.lambda = 0.5Hz
*.mu = 0.6Hz

# Configuration with default 1s parameters as requested
[Config DefaultTimes]
description = "Default 1s mean times: β_producer=1s, β_service=1s (λ=1.0, μ=1.0, ρ=1.0)"
*.lambda = 1.0Hz
*.mu = 1.0Hz
# Note: ρ=1.0 means the system is at the stability boundary
# In practice, the queue will grow indefinitely

[Config Stable]
description = "Stable system with 1s arrival, faster service: β_producer=1s, β_service=0.8s"
*.lambda = 1.0Hz
*.mu = 1.25Hz  # μ = 1/0.8 = 1.25Hz, so ρ = 1.0/1.25 = 0.8