# Legacy configurations (maintained for compatibility)
# ./out/clang-release/src/nwsim_project -u Cmdenv -c QueueMode -f simulations/nwsim_project/omnetpp.ini
[Config QueueMode]
description = "Junction queue mode with timing penalties (no entry penalty)"
*.Junc*.junctionMode = "queue"

[Config CircleMode]
description = "Junction circle mode with simple routing"
*.Junc*.junctionMode = "circle"

[Config RoundRobinMode]
description = "Junction round-robin mode with 30-second direction scheduling"
*.Junc*.junctionMode = "roundrobin"
