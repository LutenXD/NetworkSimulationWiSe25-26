[General]
network = CrossTraffic

# Simulation parameters
sim-time-limit = 20000s
warmup-period = 1000s
repeat = 10

# Statistics recording
**.scalar-recording = true
**.vector-recording = true

# Junction operation mode: "queue" (default with penalties) or "circle" (simple circular routing)
*.Junc*.junctionMode = "queue"

# Configure spawn rates for each endpoint (exponential distribution)
*.EndNW.spawnInterval = exponential(800s)

*.EndNE.spawnInterval = exponential(1200s)

*.EndEN.spawnInterval = exponential(1000s)

*.EndES.spawnInterval = exponential(1500s)

*.EndSE.spawnInterval = exponential(900s)

*.EndSW.spawnInterval = exponential(1100s)

*.EndWS.spawnInterval = exponential(1300s)

*.EndWN.spawnInterval = exponential(1400s)

# Alternative configuration sections
[Config QueueMode]
description = "Junction queue mode with timing penalties (no entry penalty)"
*.Junc*.junctionMode = "queue"

[Config CircleMode]
description = "Junction circle mode with simple routing"
*.Junc*.junctionMode = "circle"

[Config RoundRobinMode]
description = "Junction round-robin mode with 30-second direction scheduling"
*.Junc*.junctionMode = "roundrobin"
